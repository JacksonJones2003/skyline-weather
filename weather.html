<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f6fc0">
<title>Skyline Weather</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
/* Layout: immersive full-screen sky scene; hero numerals float in the upper half, hourly curve on the horizon, glass daily list below. */
:root{
  --sky-a:#2f6fc0; --sky-b:#8ec0ea; --sky-c:#3f78bd;
  --ink:#ffffff; --ink-soft:rgba(255,255,255,.8); --ink-faint:rgba(255,255,255,.58);
  --glass:rgba(255,255,255,.13); --glass-line:rgba(255,255,255,.2);
  /* buttons: a lighter shade of the live sky, half see-through (blue by day, mauve-grey at dusk, slate at night) */
  --btn:color-mix(in srgb,color-mix(in srgb,var(--sky-a) 58%,#fff) 45%,transparent);
  --warm:#ffb35c; --cool:#a6f0a0; --sun:#fff6d6;
  --font:sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{
  font-family:var(--font);color:var(--ink);
  background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 42%,var(--sky-c) 62%,var(--sky-a) 100%) fixed;
  background-color:var(--sky-a);
  padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---- sky scene ---- */
.scene{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.glow{position:absolute;left:38%;top:-6vh;width:120vw;height:120vw;max-width:900px;max-height:900px;transform:translate(-50%,-30%);
  background:radial-gradient(circle,rgba(255,252,235,1) 0 3%,rgba(255,246,214,.75) 6%,rgba(255,240,200,.25) 16%,rgba(255,255,255,0) 40%);transition:opacity 1s}
/* the glow's bright core sits 20% of its size below its anchor point; the halo and the rays share that exact center */
.halo{position:absolute;left:38%;top:-6vh;width:62vw;height:62vw;max-width:460px;max-height:460px;transform:translate(-50%,calc(-50% + .2 * min(120vw,900px)));border-radius:50%;
  box-shadow:0 0 0 2px rgba(255,220,180,.10), inset 0 0 40px rgba(255,200,170,.12);transition:opacity 1s}
/* sunlight that follows the real sun: a warm wash along the horizon at sunrise/sunset, rose-violet dusk after */
.sunwash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2s,background 2s}
.suntint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:0;transition:opacity 2s,background 2s}
.glow,.halo{transition:opacity 1s,left 2s,top 2s,filter 2s}
/* glass panels catch the light from the sun's side, warmer near sunrise and sunset */
.tile,.daily,.nowcast,.radar,.sun,.chip{background-image:linear-gradient(var(--sun-ang,180deg),rgba(255,var(--sun-g,244),var(--sun-b,226),var(--sun-a,.06)),rgba(255,255,255,0) 58%)}
.flare{position:absolute;border-radius:50%;background:rgba(255,255,255,.08);filter:blur(1px)}
.horizon{position:absolute;left:0;right:0;top:38vh;height:22vh;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.18) 50%,rgba(255,255,255,0));}
/* rainbow: a soft bow standing on the waterline/horizon, opposite the sun; faded where it meets the ground */
#rainbow{position:absolute;left:var(--rbx,70%);top:var(--horizon,45vh);width:min(150vw,1100px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  pointer-events:none;opacity:0;transition:opacity 4s;mix-blend-mode:screen;filter:blur(2.5px);
  background:radial-gradient(circle,transparent 0 59%,rgba(130,70,255,.42) 60.5%,rgba(60,120,255,.48) 62%,rgba(50,200,140,.44) 63.6%,rgba(255,232,80,.5) 65.2%,rgba(255,150,50,.46) 66.6%,rgba(255,60,60,.4) 68%,transparent 69.5%,
    transparent 76%,rgba(255,80,80,.1) 77.5%,rgba(255,230,90,.1) 79%,rgba(80,140,255,.1) 80.5%,transparent 82%);
  -webkit-mask-image:linear-gradient(#000 20%,rgba(0,0,0,.6) 38%,transparent 49.5%);mask-image:linear-gradient(#000 20%,rgba(0,0,0,.6) 38%,transparent 49.5%)}
#rainbow.on{opacity:.75}
#clouds{position:absolute;top:0;left:0;right:0;transition:opacity .6s,filter 1s}
/* storm overcast belongs to the sky above the water: it slides up and away with the page as you scroll down */
#clouds.wet{animation:cloudsAway linear both;animation-timeline:scroll(root);animation-range:0 600px}
/* The water (its picture, the cloud reflection and the number's reflection) is one layer drawn at its place on the
   page; the phone's compositor slides it up with the page and fades it over the first 260 px, in step with the
   finger, so it never lags behind the scroll. The rain falls on its own screen-fixed canvas (#fx) above it. */
#waterLayer{position:absolute;inset:0;pointer-events:none;
  animation:cloudsAway linear both,waterFade linear both;animation-timeline:scroll(root),scroll(root);animation-range:0 600px,0 260px}
@keyframes waterFade{0%{opacity:1}20%{opacity:.94}45%{opacity:.66}70%{opacity:.28}88%{opacity:.07}100%{opacity:0}}
canvas#water{position:absolute;left:0;top:0;width:100%;height:100%}
/* over water the clouds stop at the waterline (--horizon, the foot of the big number, set by the rain loop). The cut
   follows how much water is showing (--wet, 0-1): as the water fades away (a swipe, a pull, scrolling) the clouds
   below the line fade back in with it, so there's never a hard edge with no water under it */
#clouds.wet{bottom:0;--cut:calc(1 - var(--wet,0));
  -webkit-mask-image:linear-gradient(#000 calc(var(--horizon,45vh) - 1px),rgba(0,0,0,var(--cut)) var(--horizon,45vh));
  mask-image:linear-gradient(#000 calc(var(--horizon,45vh) - 1px),rgba(0,0,0,var(--cut)) var(--horizon,45vh))}
/* ...and appear upside down in the water below it: softened, darker, fading out toward you */
#cloudmirror{position:absolute;left:0;right:0;top:var(--horizon,45vh);height:var(--horizon,45vh);overflow:hidden;pointer-events:none;opacity:0;
  -webkit-mask-image:linear-gradient(#000,rgba(0,0,0,.75) 25%,rgba(0,0,0,.38) 55%,transparent 85%);mask-image:linear-gradient(#000,rgba(0,0,0,.75) 25%,rgba(0,0,0,.38) 55%,transparent 85%)}
#cloudmirror .flip{position:absolute;inset:0;transform:scaleY(-1)}
#mirrorstrip{position:absolute;top:0;left:0;will-change:transform}
#mirrorstrip img{position:absolute;top:0;height:auto;max-width:none}
@keyframes cloudsAway{to{transform:translate3d(0,-600px,0)}}
#cloudstrip{position:absolute;top:0;left:0;will-change:transform;transition:filter 2s,opacity 1.5s}
#cloudstrip img{position:absolute;top:0;height:auto;max-width:none}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50vw)}}
canvas#fx{position:absolute;inset:0;width:100%;height:100%}
/* lightning: a soft glow lighting the clouds from where the bolt strikes, and the bolt itself (see strike) */
#flash,#bolt{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash{background:radial-gradient(circle at var(--fx,50%) var(--fy,20%),rgba(235,240,255,.5),rgba(205,218,255,.2) 38%,rgba(185,200,255,.07) 70%,rgba(185,200,255,0))}
#bolt svg{display:block;filter:drop-shadow(0 0 6px rgba(200,215,255,.9))}
.water-reflection{position:absolute;pointer-events:none;white-space:nowrap;text-align:center;transform-origin:center bottom;opacity:0;
  /* the number seen in the water: bent by ripples (#waterBend), a little darker and duller than the number itself,
     strongest at the waterline and fading out with depth; it only breathes gently, never tilts as a whole */
  filter:url(#waterBend) brightness(.93) saturate(.9);will-change:transform,opacity,left,top;
  -webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.82) 30%,rgba(0,0,0,.42) 65%,transparent 96%);
  mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.82) 30%,rgba(0,0,0,.42) 65%,transparent 96%);
  animation:waterWaver 6s ease-in-out infinite}
@keyframes waterWaver{0%,100%{transform:scale(1,-.86)}50%{transform:scale(1.01,-.89)}}
/* clear nights: three star layers twinkling out of step, a dim crescent moon, and now and then a shooting star */
#stars{position:absolute;inset:0;transition:opacity 1.5s}
#stars canvas{position:absolute;inset:0;width:100%;height:100%}
#stars canvas:nth-child(1){animation:twinkle 3.4s steps(34) infinite}
#stars canvas:nth-child(2){animation:twinkle 4.6s steps(46) -1.7s infinite}
#stars canvas:nth-child(3){animation:twinkle 2.6s steps(26) -.9s infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.28}}
/* nothing loops where it can't be seen: stars only twinkle at night, the rain's reflection only waves in rain, the
   location dot only pulses on a map that's on screen, the pinwheel only spins while the hourly row is in view */
#stars:not(.on) canvas,.water-reflection:not(.live),.radar.off .me::after,.rv.parked .me::after,.hourly.off .hx.w svg{animation:none!important}
.moon{position:absolute;left:calc(50% - 150px);top:calc(var(--sat,0px) + 108px);width:30px;height:30px;
  filter:drop-shadow(0 0 6px rgba(255,246,220,.35));transition:opacity 1.5s}
.moon svg{display:block;width:100%;height:100%}
.shoot{position:absolute;width:130px;height:1.6px;border-radius:2px;transform-origin:0 50%;opacity:0;
  background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,0))}
/* clear days: faint light rays turning slowly around the sun */
.rays{position:absolute;left:38%;top:-6vh;width:170vmax;height:170vmax;translate:-50% calc(-50% + .2 * min(120vw,900px));pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,250,232,.075) 0 3deg,rgba(255,250,232,0) 5deg 12deg,rgba(255,250,232,.04) 14deg 15deg,rgba(255,250,232,0) 17deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.5) 18%,transparent 45%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.5) 18%,transparent 45%);
  animation:rays 150s steps(1500) infinite;   /* 0.24° ten times a second: looks the same, a tenth of the redraws */transition:opacity 2s,left 2s,top 2s;opacity:0}
@keyframes rays{to{rotate:360deg}}
/* while the page scrolls, the sky's own motion pauses (see setScrolling) */
.scrolling .rays,.scrolling #stars canvas,.scrolling .water-reflection{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){#stars canvas,.rays{animation:none}}

/* ---- top bar ---- */
.app{position:relative;z-index:1;max-width:560px;margin:0 auto}
.top{position:relative;z-index:5;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;
  padding:calc(var(--sat,env(safe-area-inset-top,0px)) + 10px) max(18px,var(--sar,env(safe-area-inset-right,0px))) 8px max(18px,var(--sal,env(safe-area-inset-left,0px)))}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--btn);display:grid;place-items:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.round.unit{font-size:16px;font-weight:500;letter-spacing:-.01em}
.city{text-align:center;font-size:21px;font-weight:500;letter-spacing:.01em;background:none;border:0;padding:4px 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,30,80,.45),0 1px 14px rgba(0,30,80,.35)}

.pad{padding-left:max(18px,var(--sal,env(safe-area-inset-left,0px)));padding-right:max(18px,var(--sar,env(safe-area-inset-right,0px)))}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:6px 13px;border-radius:999px;background:rgba(40,80,140,.28);
  font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip b{font-weight:600;font-size:12px;letter-spacing:.04em;border-bottom:2px solid var(--uv,#8be07a);padding-bottom:1px}

/* ---- hero ---- */
.hero{display:flex;flex-direction:column;align-items:center;padding:34px 0 6px;text-shadow:0 1px 3px rgba(0,30,80,.3),0 2px 24px rgba(0,40,100,.25)}
/* soft white glow lying under the big number, like light on a horizon */
:root{--gap:max(10px,19vh)}
/* like the system app: the number sits well down the screen with open sky between it and the hourly curve */
.hero{padding-top:max(34px,7vh)}
.hero{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.summary{font-size:20px;font-weight:500;color:rgba(235,245,255,.82)}
/* takes no height (its text hangs into the gap under the summary), so the number and the water below don't move */
.vsy{height:0;overflow:visible;font-size:14px;line-height:1.5;font-weight:500;color:rgba(232,244,255,.68);transition:opacity .6s;text-align:center;align-self:stretch}
.vsy:empty{opacity:0}
.bignum{display:flex;align-items:flex-start;gap:6px;margin-top:4px}
/* the phone's own system font (the app reads it from the phone at runtime); variable weight 100-900 */
@font-face{font-family:"PhoneSans";src:url(phone-font.ttf) format("truetype");font-weight:100 900;font-display:swap}
/* big temperature: numerals in the phone's font; the gradient and glow colors follow the weather (set in scene()) */
.temp{font-size:104px;font-weight:500;line-height:.86;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  font-family:"PhoneSans",var(--font);color:var(--t2,#f4fbff);
  background:linear-gradient(180deg,var(--t1,#fff) 0%,var(--t2,#f6fcff) 38%,var(--t3,#d6f1fb) 72%,var(--t4,#b9e6f5) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;filter:drop-shadow(0 2px 10px var(--tg,rgba(170,225,255,.35))) drop-shadow(0 1px 2px rgba(0,40,90,.18));transition:filter 1s}
/* the digits sit dead centre; the unit and 'feels like' hang off their right edge without pushing them over */
.bignum{position:relative}
/* the number sits down close to the glow beneath it; a visual shift only, so the glow, the line above and the
   hourly row below all stay where they are */
.bignum{translate:0 var(--num-drop,24px)}
.side{display:flex;flex-direction:column;justify-content:space-between;padding:4px 0 6px;position:absolute;left:calc(100% + 6px);top:0;bottom:0;white-space:nowrap}
.side .u{font-size:34px;font-weight:400;color:rgba(222,243,253,.88);line-height:1;text-shadow:0 1px 2px rgba(0,30,80,.4),0 0 10px rgba(0,40,100,.3)}
.side .fl{font-size:13px;color:rgba(228,245,253,.9);line-height:1.25;font-weight:700;text-shadow:0 1px 2px rgba(0,30,80,.55),0 0 8px rgba(0,40,100,.45)}  /* readable over bright clouds */

/* ---- hourly curve ---- */
.hourly{margin-top:var(--gap)}
/* sideways only: setting overflow-x alone makes the browser allow vertical scrolling too, and the folded wind / UV rows
   and the slider's guide line poked out below, so the hours could be nudged up and down inside the row */
.hscroll{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.hinner{position:relative;padding:0 0 6px}
.hinner > svg,.hinner > .hrow{position:relative;z-index:1}
/* the selected hour: a soft band behind its column, moved as the row scrolls */
.hl{position:absolute;top:0;bottom:0;left:0;border-radius:12px;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.13) 35%,rgba(255,255,255,.16));transition:transform .2s ease-out}
/* the bead and its level line follow the scroll frame by frame, so they need no easing of their own */
.hinner > .hcurve{position:absolute;left:0;top:0;z-index:2;overflow:hidden;pointer-events:none}
.hcurve .hhz{position:absolute;left:0;top:0;width:100%;height:0;border-top:1.5px dashed rgba(255,255,255,.45);margin-top:-.75px;will-change:transform}
.hcurve .lb{position:absolute;transform:translate(-50%,-100%);font:400 13.5px/1 sans-serif;color:rgba(255,255,255,.75);white-space:nowrap;padding-bottom:1px}
.hcurve .lb.max{font-size:16px;font-weight:600;color:#ffb35c}
.hcurve .lb.half{font-size:10.5px;color:rgba(255,255,255,.45)}
/* the bead: its own layer, moved by the GPU as the row glides */
.hcurve .hknob{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.hknob .kl{position:absolute;left:-.75px;top:19px;width:0;border-left:1.5px dashed rgba(255,255,255,.5)}
.hknob .kt{position:absolute;left:-17px;top:-17px;width:34px;height:34px;box-sizing:border-box;border-radius:50%;background:#fff;border:3.5px solid #b9ec8f;
  display:grid;place-items:center;font:600 16px/1 sans-serif;color:#1d3557;transition:scale .35s cubic-bezier(.3,1.6,.5,1)}
.hinner svg{display:block}
.hrow{display:flex}
.hcol{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px}
.hcol .icon{width:28px;height:28px}
.icon{overflow:visible;filter:drop-shadow(0 1.5px 1.5px rgba(25,60,110,.22))}
.hcol .t{font-size:16px;color:var(--ink-soft);font-variant-numeric:tabular-nums;transition:color .2s}
.hcol.sel .t{color:#fff;font-weight:500}
.hcol.now .t{font-size:19px}
/* unfolded: the half-hour columns are narrow and quiet, a small tick and time only */
.hcol.half .hd{width:28px;height:28px;display:grid;place-items:center}
.hcol.half .hd::after{content:"";width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.35)}
.hcol.half .t{font-size:10.5px;color:var(--ink-faint);letter-spacing:-.02em}
/* unfolded, the hour columns are narrower too: the time a touch smaller so "10 PM" still fits */
@media (min-width:600px){.hcol .t{font-size:14.5px}.hcol.now .t{font-size:17px}}
.hcol.half.sel .t{color:#fff;font-weight:500}
.hcol .pp{font-size:11px;color:#bfe6ff;height:1em;margin-top:-4px}
/* wind and UV for each hour (icons always; the words only under the selected hour) */
.hx{display:flex;flex-direction:column;align-items:center;gap:1px;height:36px;transition:opacity .16s ease-out}   /* gone before the labels slide over */
/* the wind and UV rows can be folded away (the thin toggle under the hours); while folding they fade in place */
.hcol{position:relative}
.hl{transform-origin:0 0}
.hourly .hrain{animation:hrainIn .5s ease-out}
.hcurve .lb.under{visibility:hidden}   /* the temperature label the snapped bead sits on (the bead shows it) */
.hourly .hrain .rbar{fill:url(#rg)}
.hourly .hrain .rbar.snow{fill:rgba(255,255,255,.92)}
.hourly .hrain .ramt.snow{fill:#fff}
.hourly .hrain .rtrack{fill:rgba(170,215,255,.13);stroke:rgba(190,225,255,.18);stroke-width:.8}
.hourly .hrain .ramt{font:600 9.5px/1 var(--font);fill:rgba(190,228,255,.92);text-anchor:middle;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:rgba(0,30,70,.35);stroke-width:2px}
@keyframes hrainIn{from{opacity:0}}
.hourly.lean .hx{position:absolute;left:0;right:0;top:var(--hxTop,62px);opacity:0;pointer-events:none}
.hourly.lean .hx.uv{top:var(--hxTop2,99px)}
.hxt{display:block;margin:2px auto 0;width:88px;height:18px;padding:0;border:0;background:none;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hxt i{position:absolute;top:7px;width:22px;height:3.5px;border-radius:2px;background:rgba(255,255,255,.42);transition:transform .38s cubic-bezier(.3,1.4,.5,1),background .2s}
.hxt i:first-child{left:22px;transform-origin:100% 50%}
.hxt i:last-child{right:22px;transform-origin:0 50%}
.hxt:active i{background:rgba(255,255,255,.7)}
/* folded: the bar bends into a soft V, pointing down to where the rows will open */
.hourly.lean .hxt i:first-child{transform:rotate(14deg)}
.hourly.lean .hxt i:last-child{transform:rotate(-14deg)}
.hx svg{width:20px;height:20px;flex:none}
.hx .lab{font-size:11px;font-weight:600;line-height:13px;white-space:nowrap;opacity:0;transition:opacity .2s}
.hcol.sel .hx .lab{opacity:1}
.hx.w svg{filter:drop-shadow(0 1px 2px rgba(0,30,80,.35))}
.hcol.sel .hx.w svg{animation:pinwheel var(--spin,4s) linear infinite}
@keyframes pinwheel{to{rotate:360deg}}
.hx.uv .lab{color:#c9b6ff}
.hx.uv svg{width:26px;height:22px}
@media (prefers-reduced-motion:reduce){.hcol.sel .hx.w svg{animation:none}}

/* ---- daily ---- */
.daily{margin-top:14px;background:rgba(80,130,200,.30);border:1px solid var(--glass-line);border-radius:22px;padding:6px 18px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.daily{padding:10px 18px;transform-origin:50% 0}
/* next-hour rain card */
.nowcast{margin-top:14px;background:rgba(80,130,200,.30);border:1px solid var(--glass-line);border-radius:22px;padding:13px 16px 11px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:riseIn .6s cubic-bezier(.2,.8,.2,1) both}
.nowcast .nh{display:flex;gap:11px;align-items:center}
.nowcast .nh svg{flex:none;width:26px;height:26px;opacity:.9}
.nowcast .nh b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.nowcast .nh small{display:block;font-size:13px;color:rgba(230,243,255,.72);margin-top:1px}
.nowcast .nbars{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:12px}
.nowcast .nbars i{flex:1;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#9fd6ff,#4f9dff)}
.nowcast .nbars i.snow{background:linear-gradient(180deg,#fff,#c9d6ff)}
.nowcast .naxis{display:flex;justify-content:space-between;font-size:11px;color:rgba(230,243,255,.6);margin-top:5px}
.drow{display:grid;grid-template-columns:2.9rem minmax(0,1fr) 3.4rem 1.9rem 1.9rem;align-items:center;column-gap:11px;padding:6px 0;font-size:17px;line-height:23px}

/* a week shows at first; "More" opens the rest of the 16 days */

.dmore{display:flex;align-items:center;justify-content:center;gap:2px;width:100%;margin-top:2px;padding:8px 0 4px;border:0;background:none;
  font-size:15px;color:rgba(255,255,255,.72);-webkit-tap-highlight-color:transparent}
.daily.all .dmore svg{rotate:-90deg}
.dmore svg{transition:rotate .25s}
.drow .lo{text-align:right;color:rgba(255,255,255,.62);font-variant-numeric:tabular-nums}

.drow{cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent;transition:background .45s ease-out}
/* a tapped day lights up on its own (the whole list doesn't ripple: it's tall, and the day's popup is opening) */
.drow.tap{background:rgba(255,255,255,.13);transition:none}
.drow:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---- day detail: tap a day for its hour-by-hour temperature line ---- */
.dsheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(10,30,60,.46);opacity:0;transition:opacity .28s;   /* a plain dim behind the popup: blurring the whole page as well was too heavy for the phone */
  padding:16px max(12px,var(--sar,env(safe-area-inset-right,0px))) max(12px,env(safe-area-inset-bottom,0px)) max(12px,var(--sal,env(safe-area-inset-left,0px)))}
.dsheet.open{opacity:1}
@media (min-width:700px){.dsheet{align-items:center}}
.dsheet .dpanel{position:relative;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;overscroll-behavior:contain;
  /* glass tinted with the live sky behind it, like the rest of the app (deep blue by day, indigo at dusk, navy at night) */
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03) 38%,rgba(255,255,255,0)),
    linear-gradient(180deg,color-mix(in srgb,var(--sky-a) 74%,transparent),color-mix(in srgb,var(--sky-c) 82%,transparent));
  border:1px solid var(--glass-line);border-radius:26px;
  backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);box-shadow:0 18px 50px rgba(0,25,70,.35);
  padding:16px 18px 18px;touch-action:pan-y}
/* a peek (long press): smaller than the full popup, centred, over a lighter dim; it grows out of the pressed spot */
.dsheet.peek{align-items:center;background:rgba(10,30,60,.3)}
.dsheet.peek .dpanel{scale:.82;pointer-events:none}
.dsheet .grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);margin:-6px auto 10px}
.dhead{display:flex;align-items:center;gap:12px}
.dhead .icon{width:46px;height:46px;flex:none}
.dhead .tt{flex:1;min-width:0}
.dhead .dn{font-size:20px;font-weight:600;text-shadow:0 1px 4px rgba(0,30,80,.3)}
.dhead .dc{font-size:14px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead .rg{font-size:26px;font-weight:300;font-variant-numeric:tabular-nums;white-space:nowrap}
.dhead .rg span{color:var(--ink-faint)}
.dhead .rg small{font-size:14px;color:var(--ink-faint)}
.dnav{display:flex;justify-content:flex-end;gap:6px;margin:-4px -4px 6px}
.dhead .mi{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid var(--glass-line)}
.dhead .mi svg{width:24px;height:24px}
.dchips{display:flex;gap:6px;overflow-x:auto;margin:14px -18px 0;padding:2px 18px;scrollbar-width:none;scroll-behavior:smooth}
.dchips::-webkit-scrollbar{display:none}
.dchips button{flex:none;border:1px solid var(--glass-line);background:rgba(255,255,255,.1);border-radius:16px;padding:6px 13px;font-size:14px;color:var(--ink-soft);
  transition:background .2s,color .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.dchips button:active{transform:scale(.94)}
.dchips button.on{background:rgba(255,255,255,.9);color:#1d3557;font-weight:600;border-color:transparent}
.dabout{font-size:13px;line-height:1.4;color:var(--ink-faint);margin:12px 2px 0}
.tile{cursor:pointer}
.uvers{display:flex;align-items:center;gap:10px;margin:16px 2px 0;font-size:18px;font-variant-numeric:tabular-nums}
.uvers span{color:var(--ink-faint)}
.uvers b{font-weight:600}
.unotes{margin-top:12px;max-height:38vh;overflow-y:auto;white-space:pre-line;font-size:14px;line-height:1.45;color:var(--ink-soft);
  background:rgba(255,255,255,.08);border:1px solid var(--glass-line);border-radius:16px;padding:12px 14px}
.ubtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ubtn{flex:1 1 auto;border:1px solid var(--glass-line);background:rgba(255,255,255,.12);border-radius:16px;padding:12px 14px;font-size:15px;
  transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .2s}
.ubtn:active{transform:scale(.95)}
.ubtn.main{flex-basis:100%;background:rgba(255,255,255,.92);color:#1d3557;font-weight:600;border-color:transparent}
#mUpdate small{font-size:12px;opacity:.6;margin-left:4px}
.uprog{margin-top:14px}
.ubar{height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.ubar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#a6f0a0,#8fd0ff);transition:width .25s ease-out}
.ustat{font-size:14px;color:var(--ink-soft);margin-top:8px;line-height:1.4}
.uprog.err .ubar{display:none}
.uprog.err .ustat{color:#ffd0c8}
#mUpdate small.new{opacity:1;background:#ff9a3c;color:#fff;border-radius:8px;padding:1px 7px;font-weight:600}
.dnav .round{width:36px;height:36px;padding:0}
.dnav .round:disabled{opacity:.3;cursor:default}
.dread{display:flex;align-items:baseline;gap:10px;margin:16px 2px 2px;min-height:26px;font-variant-numeric:tabular-nums}
.dread b{font-size:22px;font-weight:600}
.dread .h{font-size:15px;color:var(--ink-soft)}
.dread .x{margin-left:auto;font-size:13px;color:var(--ink-faint);text-align:right}
.dchart{position:relative;margin:4px -4px 0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.dchart svg{display:block;width:100%;overflow:visible}
.dchart .knob{transition:transform .12s ease-out}
.dchart .vline{transition:transform .12s ease-out}
.dchart.drag .knob circle{transform:scale(1.18)}
.dchart .knob circle{transition:transform .2s}
.dlegend{display:flex;gap:14px;font-size:12px;color:var(--ink-faint);margin:6px 2px 0}
.dlegend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.dstats div{background:rgba(255,255,255,.1);border:1px solid var(--glass-line);border-radius:16px;padding:9px 11px;min-width:0}
.dstats small{display:block;font-size:12px;color:var(--ink-faint)}
.dstats b{display:block;font-size:16px;font-weight:500;margin-top:2px;line-height:1.25;font-variant-numeric:tabular-nums}
.dchart .ml{transition:opacity .15s}

/* ---- details ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:rgba(80,130,200,.26);border:1px solid var(--glass-line);border-radius:20px;padding:11px 14px;min-width:0;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tile .k{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);font-weight:500}
.tile .v{font-size:22px;font-weight:400;margin-top:3px;font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--ink-soft);margin-top:2px}
/* gauge tiles */
.tile{display:flex;flex-direction:column;min-height:148px}
.tile.wide{grid-column:1 / -1;min-height:0}
.tile.wide .fill{min-height:34px}
.tile .hd{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile .hd .k{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink-soft)}
.tile .hd svg{width:20px;height:20px;flex:none;opacity:.92}
.tile .fill{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.tile .big{font-size:26px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .big small{font-size:13px;font-weight:400;margin-left:3px;color:var(--ink-soft)}
.tile .w{font-size:15px;font-weight:500;color:#fff}
.bar{position:relative;width:100%;height:6px;border-radius:6px}
.bar i{position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,30,80,.4)}
/* gauge animations: each tile starts at rest and plays once when it scrolls into view */
.anim .bar i{transition:left 1.3s cubic-bezier(.2,.8,.2,1) .15s}
.anim.in .bar i{left:var(--x)}
.anim .needle{transform-box:view-box;transform:rotate(0deg);transition:transform 1.5s cubic-bezier(.25,.9,.25,1.08) .15s}
.anim.in .needle{transform:rotate(var(--r))}
.anim .tick{opacity:.32;transition:opacity .25s}
.anim.in .tick.on{opacity:.9}
.anim .rise{transform:translateY(var(--h));transition:transform 1.4s cubic-bezier(.2,.8,.2,1) .15s}
.anim.in .rise{transform:translateY(0)}
.anim .ln{stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1)}
.anim.in .ln{stroke-dashoffset:0}
.anim .big,.anim .w{opacity:0;transform:translateY(6px);transition:opacity .6s .35s,transform .6s .35s}
.anim.in .big,.anim.in .w{opacity:1;transform:none}
/* opening: the forecast eases up out of the sky */
.opening .hero,.opening .hourly,.opening .chip{animation:riseIn .9s cubic-bezier(.2,.8,.2,1) both}
.opening .hourly{animation-delay:.12s}
.opening .daily,.opening .grid{animation:riseIn .9s cubic-bezier(.2,.8,.2,1) .22s both}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.anim *,.opening *{transition:none!important;animation:none!important}}
.gauge{display:block;width:100%;max-width:118px;height:auto;overflow:visible}
.gauge text{font-family:var(--font);fill:#fff}
.sun{margin-top:10px;background:rgba(80,130,200,.26);border:1px solid var(--glass-line);border-radius:20px;padding:12px 16px 12px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.sun .hd{display:flex;justify-content:space-between;align-items:baseline}
.sun .hd .k{font-size:14px;color:var(--ink-soft)}
.sun .hd .dl{font-size:13px;color:var(--ink-soft)}
.sun svg{display:block;width:100%;height:auto;max-height:150px;margin-top:4px}
.sun .times{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-top:2px}
.sun .times b{display:block;font-size:17px;font-weight:500;color:#fff}
.sun .times div:last-child{text-align:right}
.sun .times small{display:block;font-size:11px;color:var(--ink-faint);margin-top:1px}
.sun .times .mid{align-self:flex-end;font-size:12px;color:var(--ink-faint);padding-bottom:3px}
/* sun / moon tabs: the card shows one view at a time (the moon at night) */
.sun .seg{display:inline-flex;gap:2px;padding:2px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid var(--glass-line)}
.sun .seg button{border:0;background:none;color:var(--ink-soft);font-size:13px;padding:4px 12px;border-radius:12px;transition:background .28s ease,color .28s ease}
.sun .seg button[aria-selected="true"]{background:rgba(255,255,255,.9);color:#1d3557;font-weight:600}
.sun .vm{display:none}
.sun.mv .vm{display:block}
.sun.mv .vs{display:none}
.sun .hd .dl.vm{display:none}
.sun.mv .hd .dl.vm{display:inline}
.sun .mnone{font-size:14px;color:var(--ink-soft);padding:24px 2px}
.sun{cursor:pointer}
/* localhost-only sky switcher (see the devsky block in the script) */
.devsky{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
  padding:4px;border-radius:14px;background:rgba(10,20,40,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15)}
.devsky::-webkit-scrollbar{display:none}
.devsky button{flex:none;border:0;border-radius:10px;padding:5px 9px;background:none;color:rgba(255,255,255,.8);font:inherit;font-size:11.5px;white-space:nowrap}
.devsky button.on{background:rgba(255,255,255,.9);color:#1d3557;font-weight:600}
/* weather alert banner under the temperature, tinted by severity */
.walert{display:flex;align-items:center;gap:8px;width:100%;margin:10px 0 0;padding:10px 14px;border-radius:16px;font:inherit;font-size:15px;color:#fff;text-align:left;
  border:1px solid color-mix(in srgb,var(--sev) 55%,transparent);background:color-mix(in srgb,var(--sev) 24%,var(--btn));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 18px rgba(0,0,0,.12)}

/* the alert popup */
.apanel .mi svg{width:24px;height:24px}
.wlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}

.wcard .wdo{margin-top:10px;font-size:14px;line-height:1.45;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.08);white-space:pre-line}
.wcard .wdo small{display:block;font-size:12px;font-weight:700;color:var(--sev);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}

.wcard .wsrc{margin-top:4px;font-size:12px;color:var(--ink-faint)}
/* the week's sun and moon (tap the card) */
.wscale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-faint);margin:14px 2px 2px}
.wk{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:4.6rem 1fr 1fr 1.15fr;column-gap:8px;row-gap:6px;align-items:center;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
.wrow:last-child{border-bottom:0}
.wrow small{display:block;font-size:11px;color:var(--ink-faint);font-weight:400;margin-top:1px}

.wrow .wt,.wrow .wl{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}

.wbar.sunb i{background:linear-gradient(90deg,#ffb35c,#ffe08a 50%,#ffb35c)}

.foot{text-align:center;font-size:.72rem;color:var(--ink-faint);padding:16px 0 4px}
/* unfolded foldable / wide screens: sky, temperature and hourly across the top; week list and detail tiles side by side */
@media (min-width:600px){
  .app{max-width:1080px}
  #main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:16px;align-items:start}
  #main > .chip, #main > .hero, #main > .hourly, #main > .nowcast, #main > .foot, #main > .err{grid-column:1 / -1}
  #main > .chip{justify-self:start}
  #main > .daily{grid-column:1;margin-top:16px;align-self:stretch;display:flex;flex-direction:column;justify-content:space-between}
  #main > .daily:not(.all) .drow:nth-child(n+8){display:grid}

}

.err{text-align:center;padding:30vh 10px;color:var(--ink-soft)}

/* ---- search sheet ---- */
/* ---- Lifestyle page (home button): weather-based tips and stories, over the same live sky ---- */
.life{position:fixed;inset:0;z-index:32;overflow-y:auto;overscroll-behavior:contain;color:#fff;
  /* the same live sky as the forecast behind it (it follows the time of day, sunrise and sunset, and the weather),
     with a light shade on top so the words stay easy to read on the brightest skies */
  background:linear-gradient(180deg,rgba(8,24,60,.06),rgba(8,24,60,.16) 55%,rgba(8,24,60,.22)),

  background-color:var(--sky-a);transition:background-color 2s;
  padding:calc(var(--sat,env(safe-area-inset-top,0px)) + 8px) max(14px,var(--sar,env(safe-area-inset-right,0px))) 110px max(14px,var(--sal,env(safe-area-inset-left,0px)));

  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background .25s,color .25s}
.ltabs button.on{background:rgba(255,255,255,.9);color:#1d3557;font-weight:600}
.tip{margin-top:6px;border-radius:20px;padding:14px 16px;background:rgba(255,255,255,.13);border:1px solid var(--glass-line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tip .h{display:flex;justify-content:space-between;align-items:center}
.tip .h b{font-size:17px;font-weight:600}

.story{display:flex;gap:12px;align-items:flex-start;border-radius:18px;padding:12px;text-align:left;width:100%;border:1px solid var(--glass-line);

.story .tx{flex:1;min-width:0}

  background:rgba(0,0,0,.45) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="white" d="M9 7v10l8-5z"/></svg>') center/18px no-repeat}
.lmsg{text-align:center;color:var(--ink-soft);font-size:14px;padding:30px 0}

/* ---- precipitation radar ---- */

  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}

.radar .hd{display:flex;justify-content:space-between;align-items:center}

.me{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#2f7bf0;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,40,100,.45)}

/* full-screen radar: grows out of the card */
/* no text selection or system press menu on a long press of anything that peeks */
.drow,.tile[data-a]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.rv{position:fixed;inset:0;z-index:35;overflow:hidden;background:#45464a;will-change:clip-path;
  clip-path:inset(50% 50% 50% 50%);transition:clip-path .48s cubic-bezier(.25,1,.3,1)}
.rv.closing{transition:clip-path .36s cubic-bezier(.5,0,.3,1)}
.rv.parked{visibility:hidden;pointer-events:none}   /* kept laid out at full size so opening never re-sizes the map */
.rv #rmap{position:absolute;inset:0;background:#45464a}
.rv .ui{position:absolute;inset:0;z-index:1000;pointer-events:none;opacity:0;transition:opacity .25s}   /* above the map's own layers */
.rv.settled .ui{opacity:1}
.rv .ui > *{pointer-events:auto}
.rv .bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;
  padding:calc(var(--sat,env(safe-area-inset-top,0px)) + 10px) max(16px,var(--sar,env(safe-area-inset-right,0px))) 0 max(16px,var(--sal,env(safe-area-inset-left,0px)))}

/* top: close on the left; zoom and back-to-my-city on the right */

.rv .rtools{display:flex;gap:8px}
/* radar search: it takes the place of the top bar while it's open */
.rv.finding .bar,.rv.finding .rlegend{opacity:0;pointer-events:none}
.rv .rfind{position:absolute;left:0;right:0;top:0;z-index:2;
  padding:calc(var(--sat,env(safe-area-inset-top,0px)) + 10px) max(16px,var(--sar,env(safe-area-inset-right,0px))) 0 max(16px,var(--sal,env(safe-area-inset-left,0px)))}

.rv .rres button + button{border-top:1px solid rgba(255,255,255,.1)}

.rv .rres small{display:block;font-size:12.5px;color:rgba(255,255,255,.62);margin-top:1px}

.tpin.found .b{background:#4a5fa0;border-color:rgba(255,255,255,.5)}

.rv .zoom{display:flex;height:44px;border-radius:22px;overflow:hidden}

  border-radius:18px;padding:10px 14px 12px;width:132px}
.rv .rlegend .h{font-size:14px;font-weight:600;padding-bottom:8px;margin:0 -14px 8px;padding-left:14px;border-bottom:1px solid rgba(255,255,255,.12)}
.rv .rlegend .sc{display:flex;gap:10px}
/* map layer switch (rain / temperature / wind), top right under the bar */

.rv .title{height:44px;padding:0 18px;border-radius:22px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;max-width:60vw}
.rv .title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv .title small{font-weight:400;color:rgba(255,255,255,.7);font-size:13px}
.rv .panel{position:absolute;left:max(12px,var(--sal,env(safe-area-inset-left,0px)));right:max(12px,var(--sar,env(safe-area-inset-right,0px)));
  bottom:calc(env(safe-area-inset-bottom,0px) + 14px);border-radius:24px;padding:12px 14px 12px;max-width:720px;margin:0 auto}
.rv .row{display:flex;align-items:center;gap:12px}
.rv .play{flex:none;width:44px;height:44px}
.rv .tl{flex:1;min-width:0}

/* tap anywhere: a card with the rain there over the next 4 hours, and any warnings */
.rv .rtap{position:absolute;left:max(12px,var(--sal,env(safe-area-inset-left,0px)));right:max(12px,var(--sar,env(safe-area-inset-right,0px)));

.tapdot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.95);border:3px solid #5c6cff;box-shadow:0 0 0 6px rgba(92,108,255,.25),0 1px 4px rgba(0,0,0,.4);pointer-events:none}

/* the light map: pale greys and frosted white glass with dark text */

.rv.light .rsearch input::placeholder,.rv.light .rres small,.rv.light .rres .none,.rv.light .tl .lab,.rv.light .rlegend .sc div{color:rgba(29,31,36,.66)}

.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important}

/* it's an app, not a document: long presses don't select text (search boxes still do) */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* no built-in blue tap highlight or focus box anywhere; the app draws its own press effects */
*{-webkit-tap-highlight-color:transparent}
:focus:not(:focus-visible){outline:none}
/* buttons in a pill group press as round droplets, not squares */
.cgroup button{border-radius:50%;margin:0 2px}
.lg-press{border-radius:50%}
.pill.lg-press{border-radius:22px}
input{-webkit-user-select:text;user-select:text}

/* ---- dark mode: light pages and the map follow the phone's dark theme ---- */

/* ---- droplet shimmer: pressing a panel sends a water ripple across the whole glass, a sheen sweeps over it,
   its rim lights up, and the panel gives like a droplet before springing back ---- */
.tile,.daily,.radar,.sun,.ccard,.csearch,.chip,.hourly .hinner{position:relative}
.tile,.daily,.radar,.sun,.ccard,.csearch,.chip{transition:box-shadow .3s}
.et-on{box-shadow:inset 0 0 0 100vmax rgba(255,255,255,.06),0 0 0 1px rgba(255,255,255,.28),0 6px 26px rgba(160,210,255,.22)!important;transition:box-shadow .12s!important}
.et-fx{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:3;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),inset 0 0 22px rgba(255,255,255,.16);opacity:0;transition:opacity .16s}
.et-fx.on{opacity:1}
.et-fx.off{opacity:0;transition:opacity .55s ease-out}
.ccard .et-fx{z-index:1}
/* the radar card's press: no rings or sheen over the map, only a faint lit edge */
.et-fx.soft::before{display:none}
.et-fx.soft{box-shadow:inset 0 0 0 1px rgba(255,255,255,.32)}
.et-soft.et-on{box-shadow:0 0 0 1px rgba(255,255,255,.18)!important}
/* dragging across the panels: a faint glow under the finger and a barely-lit rim, handed from panel to panel */
.et-glide{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:2;opacity:0;transition:opacity .6s ease-out;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
/* the light itself is moved with a transform, so following the finger never repaints the panel */
.et-glide i{position:absolute;left:0;top:0;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;will-change:transform;
  background:radial-gradient(closest-side,rgba(255,255,255,.085),rgba(235,245,255,.03) 55%,rgba(255,255,255,0))}
.et-glide.on{opacity:1;transition:opacity .25s ease-out}
.ccard .et-glide{z-index:1}
/* rings spreading out from the touch, like a drop landing on water */
.et-ring{position:absolute;border-radius:50%;translate:-50% -50%;scale:.04;opacity:0;
  background:radial-gradient(circle,rgba(255,255,255,0) 54%,rgba(255,255,255,.2) 63%,rgba(225,245,255,.34) 67%,rgba(255,255,255,.1) 70%,rgba(255,255,255,0) 74%);
  animation:etRing .9s cubic-bezier(.2,.7,.3,1) forwards}
.et-ring.two{animation-delay:.13s;animation-duration:1.05s}
@keyframes etRing{0%{scale:.04;opacity:0}12%{opacity:1}100%{scale:1;opacity:0}}
/* a liquid sheen sliding across the panel */
.et-fx::before{content:"";position:absolute;inset:-20% -60%;
  background:linear-gradient(110deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.16) 46%,rgba(220,240,255,.26) 50%,rgba(255,255,255,.12) 54%,rgba(255,255,255,0) 62%);
  translate:-60% 0;animation:etSheen .85s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes etSheen{to{translate:60% 0}}
@media (prefers-reduced-motion:reduce){.et-ring,.et-fx::before{animation:none;opacity:0}}
/* hourly slider: the temperature circle swells into a glass bead while you drag */
.knob circle{transform-box:fill-box;transform-origin:center;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.hourly.touching .hknob .kt{scale:1.22}
/* radar timeline: the thumb becomes a glass droplet while dragging */
.rv input[type=range]::-webkit-slider-thumb{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.rv input[type=range]:active::-webkit-slider-thumb{transform:scale(1.55);
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(255,255,255,.35) 55%,rgba(200,225,255,.4));
  box-shadow:inset 0 0 0 1.2px rgba(255,255,255,.9),0 4px 12px rgba(0,30,80,.3)}

/* ---- liquid glass buttons: on press a button turns into a clear glass droplet, then springs back ---- */
.round,.pill,.cbtn,.cgroup button{transition:transform .38s cubic-bezier(.3,1.6,.5,1),background .25s,box-shadow .25s,backdrop-filter .25s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.round > *,.pill > *,.cbtn > *,.cgroup button > *{transition:filter .2s,opacity .2s}
.lg-press{transform:var(--pull,translate(0)) scale(1.16)!important;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.62),rgba(255,255,255,.14) 42%,rgba(190,220,255,.06) 70%,rgba(255,255,255,.22))!important;
  box-shadow:inset 0 0 0 1.4px rgba(255,255,255,.8),inset 0 -5px 10px rgba(255,255,255,.28),inset 0 4px 8px rgba(255,255,255,.18),0 8px 22px rgba(0,30,80,.22)!important;
  backdrop-filter:blur(1.5px) brightness(1.18) saturate(1.3)!important;-webkit-backdrop-filter:blur(1.5px) brightness(1.18) saturate(1.3)!important}
.lg-press > *{filter:blur(1.2px);opacity:.75}
.lg-release{animation:lgJelly .55s cubic-bezier(.3,.7,.4,1)}

.round{clip-path:inset(0 round 50%)}

@keyframes lgJelly{0%{transform:scale(1.16)}30%{transform:scale(.92,1.06)}55%{transform:scale(1.05,.96)}78%{transform:scale(.99,1.01)}100%{transform:none}}

/* ---- glass menu that grows out of the ⋮ button ---- */
.gmenu{position:fixed;z-index:40;overflow:hidden;border-radius:22px;pointer-events:none;color:#fff;will-change:transform;transform-origin:50% 50%;
  /* sky-tinted glass like the panels; keep these three in step with GLASS_BF / GLASS_SH in the morph */
  background:color-mix(in srgb,var(--sky-a) 70%,transparent);backdrop-filter:blur(22px) saturate(1.3) brightness(1);-webkit-backdrop-filter:blur(22px) saturate(1.3) brightness(1);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.24),inset 0 1px 10px rgba(255,255,255,.12),0 14px 40px rgba(5,20,55,.38)}
.gmenu.open{pointer-events:auto}
/* the clear glass droplet the menu is while it travels: bright rim, bluish lens tint */
.gmenu .drop{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;
  background:radial-gradient(ellipse at 35% 28%,rgba(255,255,255,.55),rgba(200,220,255,.18) 45%,rgba(150,185,255,.28) 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75),inset 0 -6px 14px rgba(255,255,255,.25)}
.gmenu .items{width:200px;padding:4px 0}
/* while the menu travels it is a droplet: a faint blue tint and the ⋮ icon ride inside its shape */
.gmenu{will-change:clip-path}
.gmenu .tint{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0}
.gmenu .gico{position:absolute;z-index:3;display:grid;place-items:center;color:#fff;pointer-events:none;opacity:0}
@keyframes btnReturn{0%{background:rgba(150,185,255,.6);box-shadow:inset 0 0 0 1.2px rgba(255,255,255,.6)}100%{}}
.btn-return{animation:btnReturn .34s cubic-bezier(.3,1.3,.5,1)}
.gmenu button{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;font:inherit;font-size:16px;color:#fff;padding:14px 20px;text-align:left}
.gmenu button + button{border-top:1px solid rgba(255,255,255,.12)}
.gmenu button[hidden]{display:none}
.gmenu button:active{background:rgba(255,255,255,.14)}
.gmenu small{color:rgba(255,255,255,.62);font-size:13px}
.gscrim{position:fixed;inset:0;z-index:39}

/* ---- pull to refresh: the page stretches down, a small ring appears in the sky ---- */
#main{transition:transform .35s cubic-bezier(.2,.8,.2,1)}

.ptr{position:fixed;left:50%;top:calc(var(--sat,env(safe-area-inset-top,0px)) + 74px);z-index:6;width:22px;height:22px;margin-left:-11px;

  background:rgba(20,30,60,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:14px;font-weight:500;pointer-events:none;
  opacity:0;transition:opacity .25s;white-space:nowrap}

  color:rgba(255,255,255,.88);text-shadow:0 1px 3px rgba(0,30,80,.4);pointer-events:none;opacity:0;transition:opacity .25s}
/* ---- bottom bar: refresh, city pager, home (frosted, like the header buttons) ---- */
#main{padding-bottom:148px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:space-between;align-items:center;pointer-events:none;
  padding:10px max(18px,var(--sar,env(safe-area-inset-right,0px))) calc(env(safe-area-inset-bottom,0px) + 14px) max(18px,var(--sal,env(safe-area-inset-left,0px)))}

.pill.scrubbing{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}

#pager.holding,#pager.scrubbing{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

  box-shadow:inset 0 1px 0 rgba(255,255,255,.25)!important}

.spin svg{animation:spin .8s linear infinite}

/* ---- city management: a light page in the phone's settings style ---- */
.cities{position:fixed;inset:0;z-index:30;color:#fff;overflow-y:auto;overscroll-behavior:contain;

  opacity:0;transform:translateX(24px);transition:opacity .22s ease-out,transform .22s ease-out}
.cities.open{opacity:1;transform:none}

.csearch{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:1px solid var(--glass-line);border-radius:22px;height:44px;padding:0 16px;margin:6px 0 14px}
.csearch svg{flex:none;color:var(--ink-soft)}

.csearch input::placeholder{color:rgba(255,255,255,.62)}
.cities .opt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;background:rgba(255,255,255,.13);color:#fff;border:1px solid var(--glass-line);border-radius:16px;padding:12px 16px;margin-bottom:8px}
.cities .opt small{color:var(--ink-faint)}
.cities .opt.loc{flex-direction:row;align-items:center;gap:10px;color:#fff;font-weight:500}
.cities .msg{color:var(--ink-soft);padding:6px 4px;font-size:14px}
.cgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.cgrid{grid-template-columns:1fr 1fr}}
.ccard{position:relative;height:86px;border-radius:18px;overflow:hidden;color:#fff;padding:0 20px;display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;box-shadow:0 2px 8px rgba(20,40,90,.12);text-shadow:0 1px 3px rgba(0,30,80,.3);transition:transform .15s}
.ccard:active{transform:scale(.98)}
/* the card's live sky (see cardSky): behind the text, clipped to the card */
.ccard > :not(.csky){position:relative;z-index:1}
.ccard > .del{position:absolute;z-index:2}
.csky{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit}
.csky i{position:absolute;display:block}
.csky .cl{top:0;left:0;width:300%;height:100%;background-repeat:no-repeat;background-size:33.34% auto;background-position:0 0,50% 0,100% 0;
  animation:cDrift 120s ease-in-out infinite alternate}
.csky .cl{opacity:.72}                                          /* softer by day, so white text stays readable */
.csky.k-snow .cl,.csky.k-cloud .cl,.csky.k-fog .cl{opacity:.6;filter:brightness(.88)}
.csky.night .cl{opacity:1;filter:brightness(.45) saturate(.85)}
.csky.k-rain .cl{opacity:.85;filter:brightness(.66) saturate(.6)}
.csky.k-storm .cl{opacity:.9;filter:brightness(.5) contrast(.9) saturate(.5)}
.csky.night.k-rain .cl,.csky.night.k-storm .cl{filter:brightness(.36) saturate(.7)}
@keyframes cDrift{to{transform:translateX(-66.66%)}}
.csky .st{inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 60%,#fff,transparent),
  radial-gradient(1.2px 1.2px at 45% 80%,#fff,transparent),radial-gradient(1px 1px at 85% 20%,#fff,transparent);background-size:83px 47px;opacity:.75;
  animation:cTwinkle 3.2s ease-in-out infinite alternate}
.csky .st.b{background-size:131px 71px;background-position:37px 19px;animation-duration:4.6s;animation-delay:-2s}
@keyframes cTwinkle{from{opacity:.25}to{opacity:.85}}
.csky .sg{width:180px;height:180px;left:-40px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,244,200,.55),rgba(255,230,160,0) 68%);
  animation:cGlow 6s ease-in-out infinite alternate}
@keyframes cGlow{to{opacity:.55;transform:scale(1.12)}}
.csky .rn{left:-20%;width:140%;top:-114px;height:calc(100% + 114px);
  background-image:radial-gradient(.8px 8px at 50% 50%,rgba(220,235,255,.6),transparent);background-size:23px 57px;animation:cRain .55s linear infinite}
.csky .rn.b{background-size:37px 57px;background-position:11px 23px;animation-duration:.7s;opacity:.7}
.csky.k-storm .rn{transform-origin:0 0;rotate:14deg;animation-duration:.4s}
@keyframes cRain{to{translate:0 114px}}
.csky .sn{left:0;width:100%;top:-120px;height:calc(100% + 120px);
  background-image:radial-gradient(1.6px 1.6px at 50% 50%,#fff,transparent);background-size:29px 40px;animation:cSnow 6s linear infinite}
.csky .sn.b{background-size:47px 60px;background-position:13px 9px;animation-duration:9s;opacity:.7}
@keyframes cSnow{from{transform:translate(0,0)}50%{transform:translate(6px,60px)}to{transform:translate(0,120px)}}
.csky .mi{top:0;left:-50%;width:200%;height:100%;background:linear-gradient(90deg,transparent,rgba(235,240,245,.35) 30%,transparent 55%,rgba(235,240,245,.28) 80%,transparent);
  animation:cMist 26s ease-in-out infinite alternate}
@keyframes cMist{to{transform:translateX(25%)}}
.csky .fl{inset:0;background:radial-gradient(circle at 70% 10%,rgba(235,240,255,.55),rgba(200,215,255,.12) 60%,transparent);opacity:0;animation:cFlash 9s linear infinite}
@keyframes cFlash{0%,90%,93.5%,100%{opacity:0}91%{opacity:.9}92%{opacity:.15}92.8%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.csky i{animation:none!important}}
.cities[hidden] .csky i{animation:none}
.ccard .n{font-size:19px;font-weight:600;display:flex;align-items:center;gap:5px}
.ccard{text-shadow:0 1px 3px rgba(0,30,80,.45),0 0 10px rgba(0,30,80,.25)}   /* a little more lift over moving clouds */
.ccard .n svg{width:15px;height:15px}

.ccard .tp{font-size:36px;font-weight:500;font-variant-numeric:tabular-nums}

.ccard .del{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:0;background:#ff4d4f;color:#fff;display:none;place-items:center;font-size:18px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.cities.editing .ccard .del{display:grid}
.cities.editing .ccard{animation:wiggle .35s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:rotate(-.4deg)}to{transform:rotate(.4deg)}}
.chint{text-align:center;color:var(--ink-faint);font-size:13px;margin-top:16px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,30,60,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(var(--sat,env(safe-area-inset-top,0px)) + 16px) max(16px,var(--sar,env(safe-area-inset-right,0px))) 16px max(16px,var(--sal,env(safe-area-inset-left,0px)))}

.ghost{background:none;border:0;padding:10px 6px;color:var(--ink-soft)}
.opt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:12px 16px;margin-bottom:8px}

<body>

<script>
(() => {
const $ = id => document.getElementById(id);
// Saved cities and settings live in the page's storage, and (in the Android app) a copy is kept in Android's own app
// storage, which survives updates. When the page's copy is missing, it's restored from Android's.
const KEEP = new Set(['places', 'place', 'idx', 'unit', 'halfHours', 'updSkip', 'hourExtras']);
const kept = (() => { try { return window.AndroidApp && window.AndroidApp.kept ? JSON.parse(window.AndroidApp.kept()) : null; } catch { return null; } })();
const keepCopy = (k, s) => { if (!KEEP.has(k)) return; try { window.AndroidApp && window.AndroidApp.keep && window.AndroidApp.keep(k, s); } catch {} };
const store = {
  get(k, d){
    try {
      let v = localStorage.getItem(k);
      if (v == null && kept && kept[k] != null) { v = kept[k]; try { localStorage.setItem(k, v); } catch {} }   // restored after an update
      return v ? JSON.parse(v) : d;
    } catch { return d; }
  },
  set(k, v){ const s = JSON.stringify(v); try { localStorage.setItem(k, s); } catch {} keepCopy(k, s); }
};
// first run with the Android copy: back up what the page already has, so it's safe from the next update on
if (kept) KEEP.forEach(k => { try { const v = localStorage.getItem(k); if (v != null && kept[k] == null) keepCopy(k, v); } catch {} });
// nothing saved anywhere but the widget still knows its city: start from that instead of an empty list
if (kept && kept.widgetPlace) { try { if (localStorage.getItem('places') == null && localStorage.getItem('place') == null) {
  const w = JSON.parse(kept.widgetPlace); store.set('places', w); store.set('place', w[0]); store.set('idx', 0); } } catch {} }
let unit = store.get('unit', 'F');
let place = store.get('place', null);
let data = null;

// ---- saved cities ----
const placeKey = p => (+p.lat).toFixed(3) + ',' + (+p.lon).toFixed(3);
const esc = t => String(t).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const PIN_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
let places = store.get('places', null);
if (!Array.isArray(places)) places = place ? [{...place, home: !!(place.auto || place.home)}] : [];   // carry over the single saved place
let idx = Math.max(0, Math.min(store.get('idx', 0), places.length - 1));
place = places[idx] || null;
const saveCities = () => { store.set('places', places); store.set('idx', idx); store.set('place', place); };
const cache = {};   // full forecasts by city, so swiping back is instant
const sums = {};    // small summaries for the city cards

const CODES = {
  0:['Clear and sunny','clear'],1:['Mostly sunny','clear'],2:['Partly cloudy','partly'],3:['Cloudy','cloud'],
  45:['Fog','fog'],48:['Freezing fog','fog'],
  51:['Light drizzle','rain'],53:['Drizzle','rain'],55:['Heavy drizzle','rain'],56:['Freezing drizzle','rain'],57:['Freezing drizzle','rain'],
  61:['Light rain','rain'],63:['Rain','rain'],65:['Heavy rain','rain'],66:['Freezing rain','rain'],67:['Freezing rain','rain'],
  71:['Light snow','snow'],73:['Snow','snow'],75:['Heavy snow','snow'],77:['Snow grains','snow'],
  80:['Showers','rain'],81:['Showers','rain'],82:['Heavy showers','rain'],85:['Snow showers','snow'],86:['Snow showers','snow'],
  95:['Thunderstorm','storm'],96:['Thunderstorm, hail','storm'],99:['Thunderstorm, hail','storm']
};
const cond = c => CODES[c] || ['—','cloud'];
// at night a clear sky isn't "sunny": the system app says Clear / Mostly clear
const nightWord = (label, day) => day ? label : label === 'Sunny' || label === 'Clear and sunny' ? 'Clear' : label === 'Mostly sunny' ? 'Mostly clear' : label;

// [top, mid-horizon, lower] per condition, day / night
const SKY = {
  clear:  [['#2f6fc0','#9cc8ee','#3f78bd'],['#0b1736','#24406e','#13254a']],
  partly: [['#3a72b8','#a6c6e4','#4679b5'],['#111d3b','#2c4268','#172846']],
  cloud:  [['#3f73b8','#a9c4e3','#4a7cbd'],['#1b2331','#3a4556','#222b3a']],
  fog:    [['#6c7c8b','#c3ccd4','#73828f'],['#20272f','#4a545e','#283039']],
  rain:   [['#38506a','#8a9fb2','#3f5670'],['#121b27','#2f3d4f','#172231']],
  snow:   [['#6687a8','#cddbe8','#6d8db0'],['#1d293d','#4b5b73','#24324a']],
  storm:  [['#2b3144','#646b85','#30374b'],['#0f1119','#2a2d3d','#151824']]
};

// ---- icons ----
// Puffy cloud: three domes on a rounded base. (x,y) = centre, k = scale (1 = fills a 64 box)
const cloudShape = (x,y,k,fill) => `<g transform="translate(${x} ${y}) scale(${k})" fill="${fill}">
  <circle cx="-12.5" cy="1" r="12"/><circle cx="2.5" cy="-5" r="17"/><circle cx="17" cy="3" r="11"/>
  <rect x="-25" y="1" width="53" height="13" rx="6.5"/></g>`;
const sunBall = (x,y,r,rays) => (rays ? [0,45,90,135,180,225,270,315].map(a=>`<line x1="${x}" y1="${y-r*1.42}" x2="${x}" y2="${y-r*1.72}" stroke="#ffc233" stroke-width="${r*.26}" stroke-linecap="round" transform="rotate(${a} ${x} ${y})"/>`).join('') : '') + `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#gSun)"/>`;
const moonShape = (x,y,r) => `<path fill="url(#gMoon)" d="M${x+r*.2} ${y-r*.98}A${r} ${r} 0 1 0 ${x+r*.98} ${y+r*.2}A${r*.85} ${r*.85} 0 0 1 ${x+r*.2} ${y-r*.98}z"/>`;
const dropShape = (x,y) => `<path fill="url(#gDrop)" d="M${x+3} ${y}c-1 4-6 7-5.2 10.6a2.8 2.8 0 0 0 5.4 .2c.6-3.6-.2-7 -.2-10.8z"/>`;
function icon(kind, day=true){
  let b='';
  switch(kind){
    case 'clear': b = day ? sunBall(32,32,14.5,true) : moonShape(32,32,20); break;
    case 'partly': b = (day ? sunBall(42,22,12.5,false) : moonShape(42,21,13)) + cloudShape(29,36,1,'url(#gCloud)'); break;
    case 'cloud': b = cloudShape(39,22,.72,'url(#gCloudBack)') + cloudShape(30,35,1,'url(#gCloud)'); break;
    case 'fog': b = cloudShape(32,26,1,'url(#gCloud)') + `<g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"><line x1="12" y1="50" x2="51" y2="50"/><line x1="18" y1="58" x2="56" y2="58"/></g>`; break;
    case 'rain': b = dropShape(18,42)+dropShape(31,44)+dropShape(44,42) + cloudShape(32,24,1,'url(#gCloudRain)'); break;
    case 'snow': b = cloudShape(32,24,1,'url(#gCloud)') + [[19,48],[32,54],[45,48]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.6" fill="#fff"/>`).join(''); break;
    case 'storm': b = cloudShape(32,24,1,'url(#gCloudStorm)') + `<path fill="url(#gBolt)" d="M35 36l-11 15h8l-4 13 13-18h-8l4-10z"/>`; break;
  }
  return `<svg class="icon" viewBox="0 0 64 64" aria-hidden="true">${b}</svg>`;
}
const sunsetIcon = rise => `<svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M14 42a18 18 0 0 1 36 0z" fill="url(#gSet)"/><g stroke="#ffb23a" stroke-width="4.5" stroke-linecap="round" fill="none"><line x1="4" y1="42" x2="60" y2="42"/><line x1="15" y1="52" x2="49" y2="52"/><path d="${rise?'M26 14l6-6 6 6M32 8v12':'M26 14l6 6 6-6M32 8v12'}" stroke-linejoin="round"/></g></svg>`;

// ---- units & formatting ----
const T = c => unit==='F' ? c*9/5+32 : c;
const tf = c => Math.round(T(c));
const wind = k => unit==='F' ? `${Math.round(k*0.621371)} mph` : `${Math.round(k)} km/h`;
const precip = mm => unit==='F' ? `${(mm/25.4).toFixed(2)} in` : `${mm.toFixed(1)} mm`;
const pressure = h => unit==='F' ? `${(h*0.02953).toFixed(2)} inHg` : `${Math.round(h)} hPa`;
const vis = m => unit==='F' ? `${(m/1609.34).toFixed(m<16000?1:0)} mi` : `${(m/1000).toFixed(m<10000?1:0)} km`;
const dir = d => ['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8];
const clock = iso => { const h=+iso.slice(11,13), m=iso.slice(14,16); return `${(h%12)||12}:${m}`; };
const ampm = iso => { const h=+iso.slice(11,13); return `${(h%12)||12} ${h<12?'AM':'PM'}`; };
const hhmm = iso => `${clock(iso)} ${+iso.slice(11,13)<12?'AM':'PM'}`;
const md = iso => `${iso.slice(5,7)}/${iso.slice(8,10)}`;
const dayName = (iso,i) => i===0?'Today':i===1?'Tomorrow':(()=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short'});})();
const uvWord = u => u<1?'Weakest':u<3?'Low':u<6?'Moderate':u<8?'High':u<11?'Very high':'Extreme';
const uvColor = u => u<3?'#8be07a':u<6?'#ffd23f':u<8?'#ff9a3c':u<11?'#ff5a4e':'#c77dff';
const dew = (t,rh) => { const a=17.27,b=237.7,g=(a*t)/(b+t)+Math.log(rh/100); return b*g/(a-g); };



function showName(){
  const el = $('placeName');
  el.innerHTML = place ? (place.home ? `<svg class="pinc" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>` : '') + esc(place.name) : 'Choose a city';
}
async function load(){
  if (!place) return;
  const p0 = place;
  showName();
  $('refreshBtn').classList.add('spin');
  const p = new URLSearchParams({
    latitude:place.lat, longitude:place.lon, timezone:'auto', forecast_days:16,
    current:'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m,wind_direction_10m,pressure_msl,uv_index,cloud_cover,precipitation',
    minutely_15:'precipitation,snowfall', forecast_minutely_15:12,
    hourly:'temperature_2m,weather_code,precipitation_probability,is_day,visibility,pressure_msl,wind_speed_10m,wind_direction_10m,uv_index,apparent_temperature,relative_humidity_2m,precipitation,dew_point_2m,wind_gusts_10m,snowfall',
    daily:'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max,precipitation_sum'
  });
  try {
    const r = await fetch('https://api.open-meteo.com/v1/forecast?'+p);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json(); j._at = new Date(); cache[placeKey(p0)] = j;
    // the widget follows the first city: give it this forecast so it updates right away (only the parts it draws)
    if (places[0] && placeKey(places[0]) === placeKey(p0)) {
      try {
        const now = j.current.time.slice(0, 13), i0 = Math.max(0, j.hourly.time.findIndex(t => t.slice(0, 13) >= now));
        const cut = a => a.slice(i0, i0 + 26);
        const w = {utc_offset_seconds: j.utc_offset_seconds, current: {time: j.current.time, temperature_2m: j.current.temperature_2m, weather_code: j.current.weather_code, is_day: j.current.is_day},
          hourly: {time: cut(j.hourly.time), temperature_2m: cut(j.hourly.temperature_2m), weather_code: cut(j.hourly.weather_code), is_day: cut(j.hourly.is_day)},
          daily: {time: j.daily.time.slice(0, 2), temperature_2m_max: j.daily.temperature_2m_max.slice(0, 2), temperature_2m_min: j.daily.temperature_2m_min.slice(0, 2),
            sunrise: j.daily.sunrise.slice(0, 2), sunset: j.daily.sunset.slice(0, 2)}};
        window.AndroidApp && window.AndroidApp.pushForecast(+p0.lat, +p0.lon, JSON.stringify(w));
      } catch {}
    }
    if (place !== p0) return;            // moved on to another city meanwhile
    data = j; render();
    aqLoad(j, p0);
    return true;
  } catch {
    if (place === p0 && !data) $('main').innerHTML = `<div class="err">Couldn't load the forecast. Check your connection, then tap the city name to try again.</div>`;
  } finally { if (place === p0) $('refreshBtn').classList.remove('spin'); }
  return false;
}

// ---- scene ----
// Big-number colors by weather: [top, upper-middle, lower-middle, bottom, glow]
const TEMP_TINT = {
  clear:  ['#fffdf5','#fff4cf','#ffe29a','#ffcd6b','rgba(255,206,110,.42)'],   // sunny: warm gold
  partly: ['#fffdf7','#fff6dc','#ffe8b0','#f6d38a','rgba(255,214,140,.36)'],   // sun and cloud: softer gold
  cloud:  ['#ffffff','#f6fcff','#d6f1fb','#b9e6f5','rgba(170,225,255,.35)'],   // cloudy: icy white
  fog:    ['#ffffff','#f3f5f8','#dde3ea','#c6cfda','rgba(215,224,236,.32)'],   // fog: soft grey
  rain:   ['#f4fbff','#d6eeff','#a6d4fb','#78b8f2','rgba(110,180,255,.45)'],   // rain: blue
  storm:  ['#eef2ff','#cdd9ff','#a0b4f4','#7c92e4','rgba(135,155,255,.45)'],   // storm: deep blue-violet
  snow:   ['#ffffff','#f8fbff','#eaf3ff','#d6e8fb','rgba(225,240,255,.45)']    // snow: bright frost
};
const NIGHT_TINT = ['#fbfbff','#e8e9ff','#c9cdfa','#adb4ef','rgba(185,190,255,.38)']; // clear nights: moonlit lavender
function tintTemp(kind, day){
  const t = !day && (kind==='clear'||kind==='partly') ? NIGHT_TINT : TEMP_TINT[kind] || TEMP_TINT.cloud;
  const R = document.documentElement.style;
  ['--t1','--t2','--t3','--t4','--tg'].forEach((v, i) => R.setProperty(v, t[i]));
}
// ---- the sun: where it is and what light it gives, from today's sunrise and sunset at this place ----
let sunKind = 'clear', sunOverride = null, sunBase = null;
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const css = a => `rgb(${a.join(',')})`;
// sunset / dusk sky: indigo above, mauve haze through the middle, navy below (like the system weather app)
const SUNSET_SKY = {gold: ['#34477f', '#c2a6c6', '#6f7fb6'], dusk: ['#22306a', '#8f7fb4', '#46548f']};
function sunState(){
  if (!data) return null;
  const d = data.daily, off = data.utc_offset_seconds || 0;
  const rise = mins(d.sunrise[0]), set = mins(d.sunset[0]);
  const now = sunOverride != null ? sunOverride : Math.floor(((Date.now() / 1000 + off) % 86400 + 86400) % 86400 / 60);
  const f = (now - rise) / (set - rise);                                      // 0 at sunrise, 1 at sunset
  const near = m => Math.max(0, 1 - Math.abs(now - m) / 75);                  // within 75 minutes of an event

          el.style.width=tr.width+'px';el.style.height=tr.height+'px';el.style.fontFamily=cs.fontFamily;el.style.fontSize=cs.fontSize;
          el.style.fontWeight=cs.fontWeight;el.style.lineHeight=cs.lineHeight;el.style.letterSpacing=cs.letterSpacing;

    }

  };

// samples a damped spring from 0 to 1 (response in seconds, damping ratio < 1 overshoots) as keyframe values
function springFrames(response, damping){
  const w = 2 * Math.PI / response, z = damping, wd = w * Math.sqrt(1 - z * z);
  const x = t => 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + z * w / wd * Math.sin(wd * t));
  let T = 0; while (T < 3 && (Math.abs(1 - x(T)) > .002 || Math.abs(1 - x(T + .05)) > .002)) T += .01;   // until it has settled
  const N = 60, v = Array.from({length: N + 1}, (_, i) => i === N ? 1 : x(T * i / N));
  return {v, ms: Math.round(T * 1000)};
}

// daily list: one week first, the full 16 days behind "More"
let dailyAll = false;
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('#dmore'); if (!b) return;
  const box = b.closest('.daily');
  if (box._busy) return;
  dailyAll = !dailyAll;
  // the same motion as the ⋮ menu: one continuous glide, with a little springy overshoot as it lands,
  // the new rows sharpening out of a blur, and the button giving a jelly bounce when it's pressed
  // a real spring (like the system's), not a fixed curve: it moves off quickly, overshoots a touch and settles
  // softly. The new rows follow the edge down one after another, coming into focus as they arrive.
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const extra = () => [...box.querySelectorAll('.drow:nth-child(n+8)')];
  b.animate([{transform: 'scale(.92,.95)'}, {transform: 'scale(1.05,.98)', offset: .4}, {transform: 'scale(.99,1.01)', offset: .7}, {transform: 'none'}],
    {duration: 460, easing: 'cubic-bezier(.3,.7,.4,1)'});
  // Smoothness: the page is laid out once, at the start; the motion itself is only clipping and sliding, which the
  // graphics chip does on its own. The panel is drawn at its full size and revealed by an animated clip, while the
  // button and everything below it slide along with the clip's edge. (Animating the real height re-laid-out the
  // whole page and re-blurred the glass on every frame, which is what made it stutter.)
  const sibs = [...box.parentElement.children].filter(el => el !== box);
  const tops = () => sibs.map(el => el.getBoundingClientRect().top);
  const h0 = box.offsetHeight, before = tops();
  box._busy = true;
  const R = getComputedStyle(box).borderTopLeftRadius;
  const clip = px => `inset(0 0 ${Math.max(0, px).toFixed(2)}px 0 round ${R})`;
  const slide = (els, dys, S, f, opts) => els.forEach((el, n) => { if (Math.abs(dys[n]) > .5) {
    el.style.willChange = 'transform';
    el.animate(S.v.map(v => ({transform: `translateY(${f(v, dys[n]).toFixed(2)}px)`})), opts);
  }});
  const finish = () => {
    box.style.paddingBottom = box.style.marginBottom = box.style.clipPath = '';
    [box, b, ...sibs].forEach(el => { el.getAnimations().forEach(a => { if (a.id === 'flow') a.cancel(); }); el.style.willChange = ''; });
    box._busy = false;
  };
  if (dailyAll) {
    box.classList.add('all');
    b.firstChild.textContent = 'Show less';
    const h1 = box.offsetHeight, after = tops(), dys = before.map((t, n) => t - after[n]);
    const S = springFrames(.52, .68), D = h1 - h0;
    if (still) { finish(); return; }
    // room for the spring to overshoot: extra padding inside the panel, cancelled by a negative margin so nothing moves
    const over = Math.ceil(Math.max(0, Math.max(...S.v) - 1) * D) + 2;
    box.style.paddingBottom = `calc(${getComputedStyle(box).paddingBottom} + ${over}px)`; box.style.marginBottom = `-${over}px`;
    const H = h1 + over, opts = {duration: S.ms, id: 'flow', fill: 'both'};
    box.style.willChange = 'clip-path';
    box.animate(S.v.map(v => ({clipPath: clip(H - (h0 + D * v))})), opts).onfinish = finish;
    b.animate(S.v.map(v => ({transform: `translateY(${(-(1 - v) * D).toFixed(2)}px)`})), {...opts, composite: 'add'});
    slide(sibs, dys, S, (v, dy) => dy * (1 - v), opts);
    extra().forEach((r, i) => r.animate([
      {opacity: 0, transform: 'translateY(-16px) scale(.97)'},
      {opacity: 1, transform: 'none'}],
      {duration: 420, delay: 40 + i * 28, easing: 'cubic-bezier(.2,.8,.25,1)', fill: 'backwards'}));
  } else {
    // measure where everything ends up once closed, then put it back open and animate toward that
    box.classList.remove('all'); const h1 = box.offsetHeight, after = tops(); box.classList.add('all');
    const dys = after.map((t, n) => t - before[n]), D = h0 - h1;
    const top = box.getBoundingClientRect().top;
    b.firstChild.textContent = 'More';                     // the label changes as the list starts to close, not after
    const done = () => {
      box.classList.remove('all');
      extra().forEach(r => r.getAnimations().forEach(a => a.cancel()));
      finish();                                              // the real layout now matches the last frame exactly
      if (top < 0) box.scrollIntoView({block: 'start', behavior: 'smooth'});
    };
    if (still) { done(); return; }
    const S = springFrames(.46, .8), rows = extra(), n = rows.length, opts = {duration: S.ms, id: 'flow', fill: 'forwards'};
    rows.forEach((r, i) => r.animate([{opacity: 1, transform: 'none'}, {opacity: 0, transform: 'translateY(-10px) scale(.98)'}],
      {duration: 260, delay: (n - 1 - i) * 14, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards'}));
    box.style.willChange = 'clip-path';
    box.animate(S.v.map(v => ({clipPath: clip(D * v)})), opts).onfinish = done;
    b.animate(S.v.map(v => ({transform: `translateY(${(-D * v).toFixed(2)}px)`})), {...opts, composite: 'add'});
    slide(sibs, dys, S, (v, dy) => dy * v, opts);
  }
});

    return a; };

    }

    const r = el.getBoundingClientRect(), x = cx - r.left, y = cy - r.top;

    const reach = Math.min(760, 2 * Math.hypot(Math.max(x, r.width - x), Math.max(y, r.height - y)) * 1.05);

})();

// liquid glass press on every button, and a water-droplet pull: drag a pressed button and it stretches after your
// finger with growing resistance, thinning as it lengthens. Let go and it springs home with a wobble; pull too far
// and it breaks free, snapping back without pressing.
(() => {
  const SEL = '.round, .pill, .cbtn, .cgroup button';               // glass buttons: they swell into a droplet when pressed
  const R = 22, BREAK = 84;                                         // resistance (px) and how far a pull goes before it lets go

  // It stretches along the pull and thins across it, but only ever on the screen's own axes (no tilt): frosted glass
  // under a tilted transform loses its rounded corners on the phone and shows up as a square.
  const stretch = (dx, dy, k, g) => {
    const d = Math.hypot(dx, dy); if (!d) return null;
    const eff = R * (1 - Math.exp(-d / R)), ux = dx / d, uy = dy / d, e = eff / R * g * k;
    return {ox: ux * eff * .3 * k, oy: uy * eff * .3 * k, sx: 1 + e * ux * ux - e * .45 * uy * uy, sy: 1 + e * uy * uy - e * .45 * ux * ux};
  };

    const s = stretch(dx, dy, k, g); if (!s) return `scale(${base})`;
    return `translate(${s.ox.toFixed(2)}px,${s.oy.toFixed(2)}px) scale(${s.sx.toFixed(4)},${s.sy.toFixed(4)})${base !== 1 ? ` scale(${base})` : ''}`;
  };

  const unshape = (dx, dy, k, g) => {

(() => {

  document.addEventListener('touchstart', e => {
    if (busy || !$('cities').hidden || !$('rv').classList.contains('parked') && !$('rv').hidden || !$('life').hidden || window.scrollY > 0 || e.target.closest('.hscroll, .dock')) { y0 = null; return; }
