const ago = t => { const m = Math.max(1, Math.round((Date.now() - t) / 60000)); return m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const aqiWord = a => a <= 50 ? 'Good' : a <= 100 ? 'Moderate' : a <= 150 ? 'Unhealthy for some' : a <= 200 ? 'Unhealthy' : a <= 300 ? 'Very unhealthy' : 'Hazardous';   // also the air-quality tile

function tipFor(id){
  if (!data) return null;
  const c = data.current, d = data.daily, h = data.hourly, fl = c.apparent_temperature, rain = d.precipitation_probability_max[0];
  const hi = d.temperature_2m_max[0], lo = d.temperature_2m_min[0], uv = d.uv_index_max[0], wind = c.wind_speed_10m;
  const nowI = Math.max(0, h.time.findIndex(t => t.slice(0, 13) >= c.time.slice(0, 13)));
  const next = (k, n) => h[k].slice(nowI, nowI + n);
  switch (id) {
    case 'you': return {title: 'Today at a glance', badge: cond(c.weather_code)[0],
      text: `${tf(lo)}° to ${tf(hi)}°${unit}, feels like ${tf(fl)}° now. ${rain >= 40 ? `${rain}% chance of rain, so keep an umbrella handy.` : rain >= 20 ? `Small chance of a shower (${rain}%).` : 'Rain is unlikely.'} UV peaks at ${Math.round(uv)} (${uvWord(uv).toLowerCase()}).`};
    case 'wear': {
      const w = fl < 0 ? ['Heavy coat', 'A warm coat, hat and gloves.'] : fl < 10 ? ['Coat', 'A coat or heavy jacket with a warm layer underneath.']
        : fl < 17 ? ['Jacket', 'A light jacket or sweater.'] : fl < 24 ? ['Light layers', 'A T-shirt with a light layer for the cooler parts of the day.']
        : fl < 30 ? ['Short sleeves', 'Light, breathable clothes.'] : ['Stay cool', 'Loose, light-colored clothes and a hat.'];
      return {title: 'What to wear', badge: w[0], text: w[1] + (hi - lo >= 10 ? ` It swings ${Math.round(T(hi) - T(lo))}° today, so layers help.` : '') + (rain >= 40 ? ' Bring a rain jacket or umbrella.' : '')};
    }
    case 'uv': return {title: 'Sun protection', badge: `UV ${Math.round(uv)} · ${uvWord(uv)}`,
      text: uv < 3 ? 'Low UV today. Sunglasses are enough for most people.' : uv < 6 ? 'Moderate UV. Use SPF 30 if you’ll be outside more than an hour.'
        : uv < 8 ? 'High UV. SPF 30+, a hat and shade around midday.' : 'Very high UV. SPF 50, cover up and avoid the midday sun.'};
    case 'travel': {
      const bad = rain >= 60 || wind > 40 || (h.visibility && Math.min(...next('visibility', 12)) < 2000);
      return {title: 'Travel', badge: bad ? 'Allow extra time' : rain >= 30 ? 'Mostly fine' : 'Good to go',
        text: bad ? 'Rain, wind or low visibility could slow the roads today. Leave a little earlier.' : rain >= 30 ? 'Some showers are possible. Roads should be mostly fine.' : 'No weather problems expected for driving or flights today.'};
    }
    case 'run': {
      const temps = next('temperature_2m', 14), pops = next('precipitation_probability', 14), days = next('is_day', 14);
      let best = -1, score = -1e9;
      temps.forEach((t, i) => { if (!days[i]) return; const sc = -Math.abs(t - 15) - pops[i] / 10; if (sc > score) { score = sc; best = i; } });
      const when = best >= 0 ? ampm(h.time[nowI + best]) : null;
      return {title: 'Exercise outside', badge: when ? `Best: ${when}` : 'Indoor day',
        text: when ? `Around ${when} looks best: about ${tf(temps[best])}° with a ${pops[best]}% chance of rain.` : 'No good daylight window left today. An indoor workout might be better.'};
    }
    case 'fish': {
      const pr = next('pressure_msl', 4), trend = pr.length > 3 ? pr[3] - pr[0] : 0;
      const good = trend < -.8 && wind < 25, ok = Math.abs(trend) <= .8 && wind < 25;
      return {title: 'Fishing', badge: good ? 'Good' : ok ? 'Fair' : 'Slow',
        text: (good ? 'Pressure is falling, which often gets fish feeding.' : ok ? 'Steady pressure: a normal day on the water.' : 'Rising pressure or strong wind can make fish less active.') + ` Wind ${wind_(wind)}.`};
    }
    case 'car': {
      const r3 = d.precipitation_probability_max.slice(0, 3), wet = r3.findIndex(x => x >= 50);
      return {title: 'Car wash', badge: wet < 0 ? 'Good day' : wet === 0 ? 'Not today' : 'Maybe wait',
        text: wet < 0 ? 'Dry for the next few days, so a wash will last.' : wet === 0 ? 'Rain is likely today.' : `Rain is likely ${wet === 1 ? 'tomorrow' : 'in two days'}, so it may not stay clean long.`};
    }
  }
  return null;
}
const wind_ = k => wind(k);

async function feedItems(tab){
  const key = tab.id + '|' + (place && place.name);
  if (feedCache[key] && Date.now() - feedCache[key].at < 15 * 60 * 1000) return feedCache[key].items;
  let items = [];
  if (tab.yt) {
    const x = new DOMParser().parseFromString(await (await fetch(FEED(`https://www.youtube.com/feeds/videos.xml?channel_id=${tab.yt}`))).text(), 'text/xml');
    items = [...x.getElementsByTagName('entry')].slice(0, 16).map(e => ({
      title: e.getElementsByTagName('title')[0]?.textContent, link: e.getElementsByTagName('link')[0]?.getAttribute('href'),
      img: e.getElementsByTagName('media:thumbnail')[0]?.getAttribute('url'), src: 'The Weather Channel', t: Date.parse(e.getElementsByTagName('published')[0]?.textContent), vid: true}));
  } else {
    const q = tab.q(place ? place.name : 'local');
    const x = new DOMParser().parseFromString(await (await fetch(FEED(`https://www.bing.com/news/search?q=${encodeURIComponent(q)}&format=rss`))).text(), 'text/xml');
    items = [...x.getElementsByTagName('item')].slice(0, 16).map(e => ({
      title: e.getElementsByTagName('title')[0]?.textContent, link: (e.getElementsByTagName('link')[0]?.textContent || '').replace(/^http:/, 'https:'),
      img: (e.getElementsByTagName('News:Image')[0]?.textContent || '').replace(/^http:/, 'https:'), src: e.getElementsByTagName('News:Source')[0]?.textContent || '',
      t: Date.parse(e.getElementsByTagName('pubDate')[0]?.textContent)}));
  }
  items = items.filter(i => i.title && i.link);
  feedCache[key] = {at: Date.now(), items};
  return items;
}
function lifeCard(){

    <div class="nums"><div><b>${tf(c.temperature_2m)}°${unit}</b><span>Right now</span></div><div><b>${tf(c.apparent_temperature)}°${unit}</b><span>Feels like</span></div>
    <div><b>${lifeAqi != null ? lifeAqi : '--'}</b><span>${lifeAqi != null ? 'Air · ' + aqiWord(lifeAqi) : 'Air quality'}</span></div></div>`;

async function showLifeTab(id, force){
  lifeTab = id;
  $('lifeTabs').querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.id === id); b.setAttribute('aria-selected', b.dataset.id === id); });
  const tab = LIFE_TABS.find(t => t.id === id), tip = tipFor(id);
  $('lifeTip').innerHTML = tip ? `<div class="tip"><div class="h"><b>${tip.title}</b><span class="badge">${esc(tip.badge)}</span></div><p>${esc(tip.text)}</p></div>` : '';
  if (force) for (const k in feedCache) if (k.startsWith(id + '|')) delete feedCache[k];
  $('lifeFeed').innerHTML = '<div class="lmsg">Loading…</div>';
  try {
    const items = await feedItems(tab);
    if (lifeTab !== id) return;
    if (!items.length) { $('lifeFeed').innerHTML = '<div class="lmsg">Nothing new here right now.</div>'; return; }
    $('lifeFeed').innerHTML = '';
    items.forEach(it => {
      const b = document.createElement('button'); b.className = 'story';
      b.innerHTML = `<div class="tx"><div class="tt"></div><div class="src"></div></div>${it.img ? `<div class="im${it.vid ? ' vid' : ''}"></div>` : ''}`;
      b.querySelector('.tt').textContent = it.title;
      b.querySelector('.src').textContent = [it.src, isNaN(it.t) ? '' : ago(it.t)].filter(Boolean).join(' · ');
      if (it.img) b.querySelector('.im').style.backgroundImage = `url("${it.img.replace(/"/g, '')}")`;
      b.onclick = () => openStory(it.link, it.title);
      $('lifeFeed').appendChild(b);
    });
  } catch { if (lifeTab === id) $('lifeFeed').innerHTML = '<div class="lmsg">Couldn’t load stories. Check your connection.</div>'; }
}

  window.open(url, '_blank');
}

// Press and glide across the location pill to scrub through saved places.
// A stationary tap keeps its existing city-list behavior.
(() => {
  const pager=$('pager'); let gesture=null, suppressClick=false;
  const nearestIndex=x=>{
    const points=[...pager.querySelectorAll('.dot,.pin')].map((el,i)=>{const r=el.getBoundingClientRect();return {i,x:r.left+r.width/2};});
    if(!points.length)return idx;
    return points.reduce((best,p)=>Math.abs(p.x-x)<Math.abs(best.x-x)?p:best,points[0]).i;
  };
  const mark=i=>[...pager.querySelectorAll('.dot,.pin')].forEach((el,n)=>el.classList.toggle('on',n===i));
  pager.addEventListener('pointerdown',e=>{
    if(places.length<2 || e.button>0)return;
    pager.classList.add('holding');
    gesture={id:e.pointerId,startX:e.clientX,target:idx,dragged:false};
    try{pager.setPointerCapture(e.pointerId)}catch{}
  });
  pager.addEventListener('pointermove',e=>{
    if(!gesture || gesture.id!==e.pointerId)return;
    if(!gesture.dragged && Math.abs(e.clientX-gesture.startX)>6){gesture.dragged=true;pager.classList.add('scrubbing');}
    if(!gesture.dragged)return;
    const i=nearestIndex(e.clientX);
    if(i!==gesture.target){
      gesture.target=i;mark(i);
      try{navigator.vibrate&&navigator.vibrate(9)}catch{}
    }
    const label=$('pagerLabel');label.textContent=places[gesture.target]?.name||'';label.classList.add('on');
    e.preventDefault();
  });
  const finish=(e,cancelled=false)=>{
    if(!gesture || (e && gesture.id!==e.pointerId))return;
    const g=gesture;gesture=null;pager.classList.remove('holding','scrubbing');$('pagerLabel').classList.remove('on');
    if(g.dragged){
      suppressClick=true;setTimeout(()=>suppressClick=false,350);
      if(!cancelled && g.target!==idx)goTo(g.target,g.target>idx?1:-1);
      else mark(idx);
    }
  };
  pager.addEventListener('pointerup',e=>finish(e));
  pager.addEventListener('pointercancel',e=>finish(e,true));
  pager.addEventListener('lostpointercapture',finish);
  pager.addEventListener('click',e=>{
    if(!suppressClick)return;
    suppressClick=false;e.preventDefault();e.stopImmediatePropagation();
  },true);
})();

async function summary(p){
  const k = placeKey(p), full = cache[k];
  if (full && Date.now() - full._at < 10 * 60 * 1000) return full;
  if (sums[k] && Date.now() - sums[k]._at < 10 * 60 * 1000) return sums[k];
  try {
    const q = new URLSearchParams({latitude: p.lat, longitude: p.lon, timezone: 'auto', forecast_days: 1,
      current: 'temperature_2m,weather_code,is_day', daily: 'temperature_2m_max,temperature_2m_min'});
    const j = await (await fetch('https://api.open-meteo.com/v1/forecast?' + q)).json();
    j._at = Date.now(); sums[k] = j; return j;
  } catch { return null; }
}
function cardBg(kind, day, n){
  const g = !day ? 'linear-gradient(160deg,#2c3f6b,#121d3a)'
    : ({cloud: 'linear-gradient(160deg,#79a6dc,#4479c2)', fog: 'linear-gradient(160deg,#9aaabb,#6a7d92)', rain: 'linear-gradient(160deg,#7189a6,#41587a)',
        storm: 'linear-gradient(160deg,#5b6781,#2d3449)', snow: 'linear-gradient(160deg,#9db7d6,#6a8cb4)'})[kind] || 'linear-gradient(160deg,#5aa6f0,#2f78d4)';
  const shade = !day ? 'linear-gradient(rgba(12,22,48,.5),rgba(12,22,48,.5)),' : (kind === 'rain' || kind === 'storm') ? 'linear-gradient(rgba(40,55,80,.3),rgba(40,55,80,.3)),' : '';
  return `${shade}${g}`;                                   // the clouds, stars, rain... move in the card's own sky layer (cardSky)
}
// A city card's live sky, like the system weather list: clouds drifting across (three neighbouring tiles of the sky
// strip, which join seamlessly, gliding slowly one way and back), stars twinkling at night, rain or snow falling, a
// flicker of lightning in a storm, mist sliding through fog, a soft sun glow on a clear day. All transform and
// opacity animations, so the phone's compositor runs them; they only play while the city list is open.
function cardSky(kind, day, n){
  const set = CLOUD_SET[kind] || 'light', t = k => `url(clouds-${set}-${(n + k) % 8}.webp)`;
  const delay = -((n * 7.3) % 60).toFixed(1);                    // each card at its own point in the drift
  let h = `<i class="cl" style="background-image:${t(0)},${t(1)},${t(2)};animation-delay:${delay}s"></i>`;
  if (!day && kind !== 'rain' && kind !== 'storm' && kind !== 'fog') h = `<i class="st"></i><i class="st b"></i>` + h;
  if (day && (kind === 'clear' || kind === 'partly')) h = `<i class="sg"></i>` + h;
  if (kind === 'rain' || kind === 'storm') h += `<i class="rn"></i><i class="rn b"></i>`;
  if (kind === 'snow') h += `<i class="sn"></i><i class="sn b"></i>`;
  if (kind === 'fog') h += `<i class="mi"></i>`;
  if (kind === 'storm') h += `<i class="fl" style="animation-delay:${-((n * 2.9) % 9).toFixed(1)}s"></i>`;
  return `<div class="csky k-${kind}${day ? '' : ' night'}" aria-hidden="true">${h}</div>`;
}
function renderCards(){
  const g = $('cgrid'); g.innerHTML = '';
  places.forEach((p, i) => {
    const k = placeKey(p), j = (cache[k] && cache[k]) || sums[k];
    const card = document.createElement('div');
    card.className = 'ccard'; card.tabIndex = 0; card.setAttribute('role', 'button');
    let cond_ = '—', range = '', temp = '--', kind = 'clear', day = true;
    if (j) {
      const [label, kd] = cond(j.current.weather_code); kind = kd; day = !!j.current.is_day;
      cond_ = nightWord(label, day); range = `${tf(j.daily.temperature_2m_min[0])} ~ ${tf(j.daily.temperature_2m_max[0])}°${unit}`;
      temp = tf(j.current.temperature_2m);
    }
    card.style.background = cardBg(kind, day, i * 3 + 1);
    card.innerHTML = cardSky(kind, day, i * 3 + 1) + `<div><div class="n">${esc(p.name)}${p.home ? PIN_SVG : ''}</div><div class="c">${esc(cond_)}&nbsp; ${range}</div></div>
      <div class="tp">${temp}<small>°${unit}</small></div>
      <button class="del" aria-label="Remove ${esc(p.name)}">−</button>`;
    card.onclick = e => {
      if (e.target.closest('.del')) { removePlace(i); return; }
      if ($('cities').classList.contains('editing')) return;
      closeCities(); goTo(i, i > idx ? 1 : i < idx ? -1 : 0);
    };
    g.appendChild(card);
  });
  $('chint').textContent = places.length ? (places.length > 1 ? 'Swipe left or right on the forecast to switch cities' : '') : 'Search for a city, or use your current location';
}

function addPlace(p){
  let i;
  if (p.home) {
    const h = places.findIndex(x => x.home); if (h >= 0) places.splice(h, 1);
    const dup = places.findIndex(x => placeKey(x) === placeKey(p)); if (dup >= 0) places.splice(dup, 1);
    places.unshift(p); i = 0;
  } else {
    i = places.findIndex(x => placeKey(x) === placeKey(p));
    if (i < 0) { places.push(p); i = places.length - 1; }
  }
  if (places.length === 1) { $('cities').classList.remove('open'); $('cities').hidden = true; try { window.AndroidApp && window.AndroidApp.lightPage(false); } catch {} }
  else closeCities();
  idx = -1; data = null; goTo(i, 0);
}
function removePlace(i){
  if (places.length <= 1) return;
  const cur = places[idx];
  places.splice(i, 1);
  let ni = places.indexOf(cur); if (ni < 0) ni = Math.min(i, places.length - 1);
  idx = -1; goTo(ni, 0); renderCards();
}

$('useLoc').onclick = () => {
  if (!navigator.geolocation){ $('results').innerHTML='<div class="msg">Location isn’t available here. Search for your city instead.</div>'; return; }
  $('results').innerHTML='<div class="msg">Finding you…</div>';

    addPlace({ name: await reverseName(lat,lon), lat, lon, home: true });
  }, err => {
    const m = err.code===1 ? 'Location permission is off for this app. Turn it on in Settings, or search for your city.'
            : err.code===3 ? 'Finding your location took too long. Tap “Use my current location” again, or search for your city.'
            : 'Couldn’t get your location. Check that location is on, or search for your city.';
    $('results').innerHTML = `<div class="msg">${m}</div>`;
  }, {timeout:30000, maximumAge:600000});
};
async function reverseName(lat, lon){
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=14&lat=${lat}&lon=${lon}`);
    const a = (await r.json()).address || {};
    const town = a.city || a.town || a.village || a.hamlet;
    if (town) return town;
    // outside town limits: ask for the nearest named town instead of the county
    try {
      const b = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`)).json();
      const near = [b.locality, b.city].find(n => n && !/County|Division|Precinct/i.test(n));
      if (near) return near;
    } catch {}
    return a.municipality || a.suburb || a.county || 'My location';
  } catch { return 'My location'; }
}

let tmr, seq=0;
async function search(q){
  const my=++seq;
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=8&language=en&name=${encodeURIComponent(q)}`);
    const list = (await r.json()).results || [];
    if (my!==seq) return;
    if (!list.length){ $('results').innerHTML=''; const m=document.createElement('div'); m.className='msg'; m.textContent=`No places match “${q}”.`; $('results').append(m); return; }
    $('results').innerHTML='';
    list.forEach(p=>{
      const b=document.createElement('button'); b.className='opt';
      const t=document.createElement('span'); t.textContent=p.name;
      const s=document.createElement('small'); s.textContent=[p.admin1,p.country].filter(Boolean).join(', ');
      b.append(t,s); b.onclick=()=>addPlace({name:p.name,lat:p.latitude,lon:p.longitude});
      $('results').appendChild(b);
    });
  } catch { if (my===seq) $('results').innerHTML='<div class="msg">Search failed. Check your connection.</div>'; }
}
$('q').addEventListener('input', e => {
  clearTimeout(tmr); const q=e.target.value.trim();
  if (q.length<2){ $('results').innerHTML=''; return; }
  tmr=setTimeout(()=>search(q),300);
});
$('q').addEventListener('keydown', e => {
  if (e.key==='Enter'){ e.preventDefault(); clearTimeout(tmr); const q=e.target.value.trim(); if(q.length>=2) search(q); e.target.blur(); }
});

document.addEventListener('visibilitychange', () => { if (!document.hidden && data && Date.now()-data._at > 10*60*1000) load(); });

places.forEach(p => { if (/ County$/.test(p.name)) reverseName(p.lat, p.lon).then(n => { p.name = n; saveCities(); if (p === place) showName(); }); });
updateDock();
if (place) load(); else { showName(); $('main').innerHTML = '<div class="err">Add a city to get started.</div>'; openCities(); }
})();
</script>
</body>
</html>
